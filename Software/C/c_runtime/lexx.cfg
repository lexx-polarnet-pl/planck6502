# RAM od $0600, całość programu w RAM
MEMORY {
    ZP:       start = $0000, size = $0100, type = rw;                  # zeropage
    BASSTART: start = $0600, size = $0020, type = rw, fill = yes, file = %O;  # program w RAM (BASIC autostart)
    RAM:      start = $0620, size = $3000, define = yes, type = rw, file = %O;      # reszta programu w RAM
}

SEGMENTS {
    ZEROPAGE: load = ZP, type = zp;
    BASSTART: load = BASSTART, type = rw; 
    CODE:     load = RAM, type = rw;
    RODATA:   load = RAM, type = rw;
    DATA:     load = RAM, type = rw,  define   = yes, run = RAM;
    ONCE:     load = RAM, type = rw;
    STARTUP:  load = RAM, type = rw;
    BSS:      load = RAM, type = bss, define = yes;   # generuje __BSS_START__ i __BSS_SIZE__
}

FEATURES {
    CONDES:    segment = STARTUP,
               type    = constructor,
               label   = __CONSTRUCTOR_TABLE__,
               count   = __CONSTRUCTOR_COUNT__;
    CONDES:    segment = STARTUP,
               type    = destructor,
               label   = __DESTRUCTOR_TABLE__,
               count   = __DESTRUCTOR_COUNT__;
}
SYMBOLS {
    # stos 6502 ($0100-$01FF)
    __STACKSTART__:        value = $01FF, type = export;



}