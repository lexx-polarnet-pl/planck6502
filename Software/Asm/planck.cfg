MEMORY {
    ZP:         start = $0000, size = $0100, type = rw, define = yes;
    BASSTART: start = $0600, size = $0020, type = rw, fill = yes, file = %O;  # program w RAM (BASIC autostart)
    RAM:      start = $0620, size = $7F00, define = yes, type = rw, file = %O;      # reszta programu w RAM    
}

SEGMENTS {
    ZEROPAGE:      load = ZP, type = zp;
    BASSTART: load = BASSTART, type = rw; 
    CODE:     load = RAM, type = rw;    
}