
MEMORY {
	ZP:				start = $0070, size = $0090, type = rw, file = ""; # strona zerowa
	BIOS_VECTORS:	start = $0200, size = $0100, type = rw, file = ""; # wektory systemowe, do przerwań
	BUFFERS: 		start = $0300, size = $0100, type = rw, file = ""; # bufor(y) wejściowe, np. klawiatura
	FILE_BUFFER: 	start = $0400, size = $0200, type = rw, file = ""; # bufor(y) plików
	SHADOW_RAM:		start = $8000, size = $4000, fill = yes, file = %O; # Domyślnie ROM, ale ten obszar może być podmieniony na RAM
	ROM:			start = $C000, size = $3E00, fill = yes, file = %O; # ROM systemowy
	KEYMAP:			start = $FE00, size = $0100, fill = yes, file = %O; # Mapa klawiszy
	BIOS_FUNCTIONS:	start = $FF00, size = $0080, fill = yes, file = %O; # Funkcje BIOSu
	IO:				start = $FF80, size = $007A, fill = yes, file = %O; # tutaj kiedyś będą siedziały IO
	CPUINIT:		start = $FFFA, size = $0006, fill = yes, file = %O; # wektory resetu i przerwań
	DUMMY:			start = $0000, size = $00FF, file = "";
}

SEGMENTS {
	ZEROPAGE:		load = ZP, type = zp;
	BUFFERS: 		load = BUFFERS, type = rw;
	FILE_BUFFER: 	load = FILE_BUFFER, type = rw;
	KERNAL:			load = ROM,	type = ro;
	RODATA:			load = ROM,	type = ro;
	KEYMAP:			load = KEYMAP,	type = ro;
	CPUINIT:		load = CPUINIT,	type = ro;
	BIOS_FUNCTIONS:	load = BIOS_FUNCTIONS,	type = ro;
	BIOS_VECTORS:	load = BIOS_VECTORS,	type = rw;
	HEADER:			load = SHADOW_RAM,	type = ro;
	VECTORS:		load = SHADOW_RAM,	type = ro;
	KEYWORDS:		load = SHADOW_RAM,	type = ro;
	ERROR:			load = SHADOW_RAM,	type = ro;
	CODE:			load = SHADOW_RAM,	type = ro;
	CHRGET:			load = SHADOW_RAM,	type = ro;
	INIT:			load = SHADOW_RAM,	type = ro;
	EXTRA:			load = SHADOW_RAM,	type = ro;
	DUMMY:			load = DUMMY; # don't include
}

